name: Verify theme plugin

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: IntellijIdeaCommunity
            release: '2024.3'
          - product: IntellijIdeaUltimate
            release: '2025.2.6.4'
          - product: IntellijIdeaUltimate
            release: '2025.3'
          - product: WebStorm
            release: '2025.3'
          - product: PyCharmProfessional
            release: '2025.3'
          - product: GoLand
            release: '2025.3'
          - product: DataGrip
            release: '2025.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check theme assets and contrast
        run: python3 scripts/verify_theme_assets.py
      - name: Build plugin
        run: ./gradlew buildPlugin
      - name: Check the packaged API references
        run: python3 scripts/verify_plugin_api.py build/distributions/*.zip
      - name: Verify plugin against the target IDE
        run: >-
          ./gradlew verifyPlugin
          -PverifyIde=${{ matrix.product }}
          -PverifyIdeVersion=${{ matrix.release }}
      - name: Upload plugin archive
        if: matrix.product == 'WebStorm'
        uses: actions/upload-artifact@v4
        with:
          name: solarized-osaka-plugin
          path: build/distributions/*
